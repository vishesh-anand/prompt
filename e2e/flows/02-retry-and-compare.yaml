# The feedback screen (step D2) pins its one filled button below the scroll, so the flow waits for it instead of scrolling.
# Three real answers (real transcription and Claude, counted in the 10 a day): a first try, a retry, and a third try.
# This is the flow that would have caught the step 6 crash: the feedback screen stays mounted under the compare screen.
appId: com.visheshanand.prompt
---
- launchApp
- runFlow: onboard.yaml
- extendedWaitUntil:
    visible: "Answer today's question"
    timeout: 30000
# Starts on Work so the next-question check below is about one list of questions.
- tapOn: "Work"
- waitForAnimationToEnd
- copyTextFrom:
    id: "home-question"
- evalScript: ${output.before = maestro.copiedText}
- tapOn: "Answer today's question"

# First try.
- runFlow: answer.yaml
# The new feedback screen (step D2): the tip card, then the one filled button pinned below the scroll.
- extendedWaitUntil:
    visible: "Your one thing for next time"
    timeout: 120000
- extendedWaitUntil:
    visible: "Try again with this tip"
    timeout: 120000
    label: "The pinned button appears once the answer is fully processed"
- assertVisible: "What an AI listener understood"
- assertNotVisible: "That didn’t process. Your recording is saved. Tap to try again."
- assertNotVisible: "See before and after"

# Retry, then look at the before and after.
- tapOn: "Try again with this tip"
- runFlow: answer.yaml
- scrollUntilVisible:
    element: "See before and after"
    timeout: 180000
- tapOn: "See before and after"
- extendedWaitUntil:
    visible: "Your tip:.*"
    timeout: 30000
    label: "The before-and-after shows the tip it checked"
- assertVisible: "Before and after"
- assertVisible: "Work · second try"

# Third try, from the compare screen: it compares with the first try again.
- tapOn: "Try again"
- runFlow: answer.yaml
- scrollUntilVisible:
    element: "See before and after"
    timeout: 180000
- tapOn: "See before and after"
- extendedWaitUntil:
    visible: "Compared with your first try"
    timeout: 30000
- assertVisible: "Work · third try"

# Done goes back to Home, which now asks a different question and shows the streak.
- scrollUntilVisible:
    element: "Done"
    timeout: 60000
- tapOn: "Done"
- extendedWaitUntil:
    visible: "Answer today's question"
    timeout: 30000
- assertVisible: "Streak: .* in a row"
- copyTextFrom:
    id: "home-question"
- assertTrue:
    condition: ${maestro.copiedText !== output.before}
    label: "Home moves on to the next question after you answered"
