# The feedback screen scrolls and its buttons sit below the fold, so the flow scrolls to them.
# Three real answers (real transcription and Claude, counted in the 10 a day): a first try, a retry, and a third try.
# This is the flow that would have caught the step 6 crash: the feedback screen stays mounted under the compare screen.
appId: com.visheshanand.prompt
---
- launchApp
- runFlow: onboard.yaml
- extendedWaitUntil:
    visible: "Answer today's question"
    timeout: 30000
# Starts on Work so the next-question check below is about one list of questions.
- tapOn: "Work"
- waitForAnimationToEnd
- copyTextFrom:
    id: "home-question"
- evalScript: ${output.before = maestro.copiedText}
- tapOn: "Answer today's question"

# First try.
- runFlow: answer.yaml
- extendedWaitUntil:
    visible: "Your one tip"
    timeout: 120000
- scrollUntilVisible:
    element: "Try again"
    timeout: 120000
- assertNotVisible: "That didn't process. Your recording is saved. Tap to try again."
- assertNotVisible: "See before and after"

# Retry, then look at the before and after.
- tapOn: "Try again"
- runFlow: answer.yaml
- scrollUntilVisible:
    element: "See before and after"
    timeout: 180000
- tapOn: "See before and after"
- assertVisible: "Before and after"
- assertVisible: "First try"
- assertVisible: "Now"

# Third try, from the compare screen: it compares with the first try again.
- tapOn: "Try again"
- runFlow: answer.yaml
- scrollUntilVisible:
    element: "See before and after"
    timeout: 180000
- tapOn: "See before and after"
- assertVisible: "Before and after"
- assertVisible: "First try"
- assertVisible: "Now"

# Done goes back to Home, which now asks a different question and shows the streak.
- scrollUntilVisible:
    element: "Done"
    timeout: 60000
- tapOn: "Done"
- extendedWaitUntil:
    visible: "Answer today's question"
    timeout: 30000
- assertVisible: "Streak: .* in a row"
- copyTextFrom:
    id: "home-question"
- assertTrue:
    condition: ${maestro.copiedText !== output.before}
    label: "Home moves on to the next question after you answered"
